<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Line-Item Ledger</title>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --gray: #6c757d; }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 15px; background: #f0f2f5; max-width: 500px; margin: auto; color: #333; line-height: 1.4; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 1rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .camera-label { background: var(--primary); color: white; padding: 20px; display: block; border-radius: 12px; cursor: pointer; font-weight: bold; text-align: center; box-shadow: 0 4px 12px rgba(0,123,255,0.3); }
        #previewContainer img { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; }

        .item-row { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .item-info { font-size: 0.9rem; margin-bottom: 5px; }
        .item-desc { font-weight: bold; display: block; margin-bottom: 2px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: #e9ecef; color: var(--danger); }
        .btn-settings { background: none; color: var(--gray); font-size: 13px; text-decoration: underline; margin-top: 20px; }
        
        #status { text-align: center; margin: 15px; font-weight: bold; color: var(--primary); min-height: 1.2em; }
        #configPanel { display: none; border: 2px solid var(--primary); }
        
        /* Debug Box */
        #debugBox { display: none; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 11px; margin-top: 20px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <div id="configPanel" class="card">
        <h3>⚙️ Connection Settings</h3>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <input type="text" id="sheetUrl" placeholder="Google Apps Script URL">
        <button class="btn-success" onclick="saveSettings()">Save Settings</button>
    </div>

    <div class="card">
        <h3>1. Global Receipt Info</h3>
        <input type="text" id="globalStore" placeholder="Store Name (Auto-fills)">
        <input type="date" id="globalDate">
        <input type="text" id="paymentMethod" placeholder="Payment Method (e.g. Visa 1234)">
        <input type="text" id="rebateNum" placeholder="Rebate Number (Optional)">
        <input type="number" id="discountAmt" placeholder="Global Discount (Optional)">
        
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
            <input type="checkbox" id="saveImage" style="width: 20px; height: 20px;"> 
            <label for="saveImage" style="font-size: 0.9rem;">💾 Save photo to Google Drive?</label>
        </div>
    </div>

    <div class="card">
        <label for="cameraInput" class="camera-label">📸 OPEN CAMERA & SNAP</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <div id="previewContainer" style="display:none;"><img id="imagePreview"></div>
    </div>

    <div id="status">Ready</div>

    <div id="reviewSection" class="card" style="display:none;">
        <h3>2. Item Category Review</h3>
        <div id="itemContainer"></div>
        <div class="btn-group">
            <button class="btn-danger" onclick="resetApp()">Clear</button>
            <button id="sendBtn" class="btn-success">Push to Sheet</button>
        </div>
    </div>

    <center><button class="btn-settings" onclick="toggleSettings()">Developer Settings</button></center>
    <div id="debugBox"></div>

    <script type="module">
        import { GoogleGenerativeAI, HarmCategory, HarmBlockThreshold } from "@google/generative-ai";

        const cameraInput = document.getElementById('cameraInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');
        const status = document.getElementById('status');
        const debugBox = document.getElementById('debugBox');
        const sendBtn = document.getElementById('sendBtn');
        
        let extractedItems = [];
        let base64Image = "";

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            imagePreview.src = URL.createObjectURL(file);
            previewContainer.style.display = "block";
            status.innerText = "⚡ Analyzing Image...";
            debugBox.style.display = "none";

            const reader = new FileReader();
            reader.onloadend = async () => {
                base64Image = reader.result.split(',')[1];
                await analyzeImage(base64Image);
            };
            reader.readAsDataURL(file);
        });

        async function analyzeImage(base64) {
            const key = localStorage.getItem('gemini_key');
            if (!key) return alert("Please set API Key in Settings!");

            try {
                const genAI = new GoogleGenerativeAI(key);
                
                // SAFETY: Disable filters that block receipts with names/numbers
                const safetySettings = [
                    { category: HarmCategory.HARM_CATEGORY_HARASSMENT, threshold: HarmBlockThreshold.BLOCK_NONE },
                    { category: HarmCategory.HARM_CATEGORY_HATE_SPEECH, threshold: HarmBlockThreshold.BLOCK_NONE },
                    { category: HarmCategory.HARM_CATEGORY_SEXUALLY_EXPLICIT, threshold: HarmBlockThreshold.BLOCK_NONE },
                    { category: HarmCategory.HARM_CATEGORY_DANGEROUS_CONTENT, threshold: HarmBlockThreshold.BLOCK_NONE },
                ];

                const model = genAI.getGenerativeModel({ 
                    model: "gemini-1.5-flash",
                    safetySettings,
                    generationConfig: { responseMimeType: "application/json" }
                });
                
                const prompt = `OCR Task: Extract merchant, date, and items. 
                CRITICAL: Completely ignore personal names, customer signatures, and phone numbers. 
                Return strictly JSON: { "store": "string", "date": "YYYY-MM-DD", "items": [{ "description": "string", "item_no": "string", "price": number, "qty": number }] }`;

                const result = await model.generateContent([
                    prompt, 
                    { inlineData: { data: base64, mimeType: "image/jpeg" } }
                ]);

                const response = await result.response;
                const text = response.text();
                
                debugBox.innerText = "RAW AI RESPONSE:\n" + text;
                debugBox.style.display = "block";

                const data = JSON.parse(text);
                document.getElementById('globalStore').value = data.store || "";
                document.getElementById('globalDate').value = data.date || "";
                
                extractedItems = data.items;
                renderReview(extractedItems);
                status.innerText = "✅ Extraction Complete";
            } catch (err) {
                console.error(err);
                debugBox.innerText = "ERROR LOG:\n" + err.toString();
                debugBox.style.display = "block";
                status.innerText = "❌ Analysis Error (See Debug Box)";
            }
        }

        function renderReview(items) {
            const container = document.getElementById('itemContainer');
            container.innerHTML = "";
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "item-row";
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-desc">${item.description}</span>
                        $${item.price} | Qty: ${item.qty} | SKU: ${item.item_no || 'N/A'}
                    </div>
                    <input type="text" id="cat-${i}" placeholder="Category (e.g. Lunch)">
                `;
                container.appendChild(div);
            });
            document.getElementById('reviewSection').style.display = "block";
        }

        sendBtn.addEventListener('click', async () => {
            const sheetUrl = localStorage.getItem('sheet_url');
            if (!sheetUrl) return alert("Set Apps Script URL in Settings!");
            status.innerText = "📤 Sending to Sheet...";

            const payload = {
                saveImage: document.getElementById('saveImage').checked,
                imageFile: document.getElementById('saveImage').checked ? base64Image : null,
                items: extractedItems.map((item, i) => ({
                    date: document.getElementById('globalDate').value,
                    store: document.getElementById('globalStore').value,
                    payment: document.getElementById('paymentMethod').value,
                    rebate: document.getElementById('rebateNum').value,
                    discount: document.getElementById('discountAmt').value,
                    description: item.description,
                    item_no: item.item_no,
                    price: item.price,
                    qty: item.qty,
                    category: document.getElementById(`cat-${i}`).value
                }))
            };

            try {
                await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                status.innerText = "🚀 Successfully Logged!";
                setTimeout(resetApp, 2000);
            } catch (err) {
                status.innerText = "❌ Sync Failed.";
            }
        });

        window.resetApp = () => {
            extractedItems = [];
            base64Image = "";
            document.getElementById('reviewSection').style.display = "none";
            document.getElementById('previewContainer').style.display = "none";
            document.getElementById('cameraInput').value = "";
            status.innerText = "Ready";
        };

        window.toggleSettings = () => {
            const p = document.getElementById('configPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        };

        window.saveSettings = () => {
            localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
            localStorage.setItem('sheet_url', document.getElementById('sheetUrl').value);
            toggleSettings();
            alert("Settings Saved Locally.");
        };
    </script>
</body>
</html>
