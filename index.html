<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Ledger Pro 2026</title>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai@latest" } }
    </script>
    <style>
        :root { --primary: #6366f1; --success: #22c55e; --danger: #ef4444; --slate: #1e293b; }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 10px; background: #f1f5f9; max-width: 600px; margin: auto; color: var(--slate); }
        .card { background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid #e2e8f0; }
        h3 { margin: 0 0 10px 0; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .camera-btn { background: var(--primary); color: white; padding: 18px; display: block; border-radius: 12px; cursor: pointer; font-weight: bold; text-align: center; }
        #previewContainer img { width: 100%; border-radius: 12px; margin-top: 10px; }

        .item-row { background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; position: relative; }
        .item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .calc-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 11px; }
        .calc-box label { display: block; color: #64748b; margin-bottom: 2px; font-weight: bold; }
        .calc-box input { padding: 5px; font-size: 12px; }
        
        .final-badge { background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 8px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: #e2e8f0; color: var(--danger); }
        
        #status { text-align: center; margin: 10px; font-weight: 600; color: var(--primary); font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="configPanel" class="card" style="display:none; background:#fffbeb;">
        <h3>⚙️ Setup</h3>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <input type="text" id="sheetUrl" placeholder="Script URL">
        <button class="btn-success" onclick="saveSettings()">Save</button>
    </div>

    <div class="card">
        <h3>1. Global Overrides</h3>
        <div class="grid-2">
            <input type="text" id="globalStore" placeholder="Store Name">
            <input type="date" id="globalDate">
        </div>
        <div class="grid-2">
            <input type="number" id="defaultTax" value="6" step="0.1" placeholder="Default Tax %">
            <input type="number" id="globalRebate" value="11" placeholder="Default Rebate %">
        </div>
        <input type="text" id="rebateNum" placeholder="Rebate ID (e.g. #9912)">
    </div>

    <div class="card">
        <label for="cameraInput" class="camera-btn">📸 SCAN RECEIPT</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <div id="previewContainer" style="display:none;"><img id="imagePreview"></div>
    </div>

    <div id="status">Ready</div>

    <div id="reviewSection" style="display:none;">
        <h3>2. Line Item Calculations</h3>
        <div id="itemContainer"></div>
        <div class="btn-group">
            <button class="btn-danger" onclick="resetApp()">Discard</button>
            <button id="sendBtn" class="btn-success">Push to Sheets</button>
        </div>
    </div>

    <center><button style="background:none; border:none; color:#94a3b8; font-size:11px; text-decoration:underline;" onclick="document.getElementById('configPanel').style.display='block'">Settings</button></center>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        let localItems = [];
        let base64Image = "";

        const cameraInput = document.getElementById('cameraInput');
        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('imagePreview').src = URL.createObjectURL(file);
            document.getElementById('previewContainer').style.display = "block";
            document.getElementById('status').innerText = "🧠 Gemini 3 Processing...";
            
            const reader = new FileReader();
            reader.onloadend = async () => {
                base64Image = reader.result.split(',')[1];
                await analyzeImage(base64Image);
            };
            reader.readAsDataURL(file);
        });

        async function analyzeImage(base64) {
            const key = localStorage.getItem('gemini_key');
            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-3-flash-preview" });
                
                const prompt = `OCR and Calculate: Extract Store, Date, and Items.
                Items must include: description, qty, unit_price, total_cost.
                IMPORTANT: If an item looks like a non-taxable grocery staple, flag it.
                Return JSON: {"store": "str", "date": "str", "items": [{"desc": "str", "qty": num, "price": num, "total": num, "isTaxable": bool}]}`;

                const result = await model.generateContent([prompt, { inlineData: { data: base64, mimeType: "image/jpeg" } }]);
                const data = JSON.parse(await result.response.text());

                document.getElementById('globalStore').value = data.store || "";
                document.getElementById('globalDate').value = data.date || "";
                
                localItems = data.items;
                renderReview();
                document.getElementById('status').innerText = "✅ Analysis Complete";
            } catch (err) { document.getElementById('status').innerText = "❌ Error: " + err.message; }
        }

        window.renderReview = () => {
            const container = document.getElementById('itemContainer');
            container.innerHTML = "";
            const defTax = document.getElementById('defaultTax').value;
            const defRebate = document.getElementById('globalRebate').value;

            localItems.forEach((item, i) => {
                const taxRate = item.isTaxable ? defTax : 0;
                const div = document.createElement('div');
                div.className = "item-row";
                div.innerHTML = `
                    <div class="item-header">
                        <input type="checkbox" checked id="sync-${i}" style="width:20px; height:20px;">
                        <input type="text" value="${item.desc}" id="desc-${i}" style="margin:0; font-weight:bold;">
                    </div>
                    <div class="calc-box">
                        <div>
                            <label>Base Total</label>
                            <input type="number" step="0.01" value="${item.total}" id="base-${i}" oninput="recalc(${i})">
                        </div>
                        <div>
                            <label>Tax %</label>
                            <input type="number" step="0.1" value="${taxRate}" id="taxR-${i}" oninput="recalc(${i})">
                        </div>
                        <div>
                            <label>Rebate (% or $)</label>
                            <input type="text" value="${defRebate}%" id="rebR-${i}" oninput="recalc(${i})">
                        </div>
                    </div>
                    <div id="results-${i}" class="final-badge">Calculating...</div>
                `;
                container.appendChild(div);
                recalc(i);
            });
            document.getElementById('reviewSection').style.display = "block";
        }

        window.recalc = (i) => {
            const base = parseFloat(document.getElementById(`base-${i}`).value) || 0;
            const taxR = parseFloat(document.getElementById(`taxR-${i}`).value) || 0;
            const rebRaw = document.getElementById(`rebR-${i}`).value;
            
            // Tax Calculation
            const taxAmt = base * (taxR / 100);
            const pricePlusTax = base + taxAmt;

            // Rebate Calculation (detect % or flat $)
            let rebAmt = 0;
            if (rebRaw.includes('%')) {
                rebAmt = base * (parseFloat(rebRaw) / 100);
            } else {
                rebAmt = parseFloat(rebRaw) || 0;
            }

            const priceMinusRebate = base - rebAmt;
            const finalCost = base - rebAmt; // As per your logic "Total - Rebate"

            document.getElementById(`results-${i}`).innerHTML = `
                Final: $${finalCost.toFixed(2)} 
                <span style="font-size:10px; color:#64748b; margin-left:10px;">
                    (+Tax: $${pricePlusTax.toFixed(2)} | -Reb: $${priceMinusRebate.toFixed(2)})
                </span>
            `;
            
            // Store calculated values in the object for sending
            localItems[i].calculated = { taxAmt, pricePlusTax, rebAmt, priceMinusRebate, finalCost };
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const sheetUrl = localStorage.getItem('sheet_url');
            const dataToSend = localItems.filter((_, i) => document.getElementById(`sync-${i}`).checked).map((item, i) => ({
                date: document.getElementById('globalDate').value,
                store: document.getElementById('globalStore').value,
                rebateID: document.getElementById('rebateNum').value,
                description: document.getElementById(`desc-${i}`).value,
                baseTotal: parseFloat(document.getElementById(`base-${i}`).value),
                taxRate: parseFloat(document.getElementById(`taxR-${i}`).value),
                rebateApplied: item.calculated.rebAmt,
                finalCost: item.calculated.finalCost,
                pricePlusTax: item.calculated.pricePlusTax
            }));

            document.getElementById('status').innerText = "📤 Syncing...";
            await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({items: dataToSend, imageFile: base64Image}) });
            document.getElementById('status').innerText = "🚀 Success!";
            setTimeout(resetApp, 2000);
        });

        window.resetApp = () => location.reload();
        window.saveSettings = () => {
            localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
            localStorage.setItem('sheet_url', document.getElementById('sheetUrl').value);
            document.getElementById('configPanel').style.display='none';
        };
    </script>
</body>
</html>
