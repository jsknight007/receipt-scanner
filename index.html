<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Ledger Pro 3.3</title>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai@latest" } }
    </script>
    <style>
        :root { --primary: #6366f1; --success: #22c55e; --danger: #ef4444; --slate: #1e293b; }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 10px; background: #f1f5f9; max-width: 600px; margin: auto; color: var(--slate); }
        .card { background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid #e2e8f0; }
        h3 { margin: 0 0 10px 0; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .camera-btn { background: var(--primary); color: white; padding: 18px; display: block; border-radius: 12px; cursor: pointer; font-weight: bold; text-align: center; }
        #previewContainer img { width: 100%; border-radius: 12px; margin-top: 10px; }
        .item-row { background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .calc-box { background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 11px; margin-top: 8px; }
        .calc-box label, .grid-3 label { display: block; color: #64748b; margin-bottom: 2px; font-weight: bold; font-size: 10px; }
        .final-badge { background: #e0e7ff; color: var(--primary); padding: 8px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-top: 8px; display: block; border: 1px solid #c7d2fe; line-height: 1.4; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: #e2e8f0; color: var(--danger); }
        #status { text-align: center; margin: 10px; font-weight: 600; color: var(--primary); }
    </style>
</head>
<body>

    <div id="configPanel" class="card" style="display:none; background:#fffbeb;">
        <h3>⚙️ Setup</h3>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <input type="text" id="sheetUrl" placeholder="Script URL">
        <button class="btn-success" onclick="saveSettings()">Save</button>
    </div>

    <div class="card">
        <h3>1. Global Trip Meta</h3>
        <div class="grid-2">
            <input type="text" id="globalStore" placeholder="Store">
            <input type="date" id="globalDate">
        </div>
        <div class="grid-2">
            <input type="text" id="paymentMethod" placeholder="Payment Method">
            <input type="text" id="rebateNum" placeholder="Rebate ID #">
        </div>
        <div class="grid-2">
            <div><label>Tax %</label><input type="number" id="defaultTax" value="6" step="0.1"></div>
            <div><label>Rebate %</label><input type="number" id="globalRebate" value="11"></div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
            <input type="checkbox" id="saveImage" checked> <label style="font-size:0.85rem;">Save Photo?</label>
        </div>
    </div>

    <div class="card">
        <label for="cameraInput" class="camera-btn">📸 SNAP RECEIPT</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <div id="previewContainer" style="display:none;"><img id="imagePreview"></div>
    </div>

    <div id="status">Ready</div>

    <div id="reviewSection" style="display:none;">
        <h3>2. Item Review & Calculations</h3>
        <div id="itemContainer"></div>
        <div class="btn-group">
            <button class="btn-danger" onclick="clearAllFields()">Discard / Reset</button>
            <button id="sendBtn" class="btn-success">Sync to Sheet</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI, HarmCategory, HarmBlockThreshold } from "@google/generative-ai";

        let localItems = [];
        let base64Image = "";

        document.getElementById('cameraInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('imagePreview').src = URL.createObjectURL(file);
            document.getElementById('previewContainer').style.display = "block";
            document.getElementById('status').innerText = "🧠 Analyzing Image...";
            const reader = new FileReader();
            reader.onloadend = async () => {
                base64Image = reader.result.split(',')[1];
                await analyzeImage(base64Image);
            };
            reader.readAsDataURL(file);
        });

        async function analyzeImage(base64) {
            const key = localStorage.getItem('gemini_key');
            if (!key) return alert("Please set API Key in Settings!");
            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-3-flash-preview",
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompt = `OCR: Extract Store, Date, and items. 
                For each item: item_no, description, category, qty, unit_price, total_line_cost. 
                Return JSON only. Format: {"store": "str", "date": "str", "items": [{"itemNo": "str", "desc": "str", "cat": "str", "qty": num, "unit": num, "total": num, "isTaxable": bool}]}`;

                const result = await model.generateContent([prompt, { inlineData: { data: base64, mimeType: "image/jpeg" } }]);
                let text = await result.response.text();
                const cleanJson = text.replace(/```json|```/g, "").trim();
                const data = JSON.parse(cleanJson);

                document.getElementById('globalStore').value = data.store || "";
                document.getElementById('globalDate').value = data.date || "";
                localItems = data.items;
                renderReview();
                document.getElementById('status').innerText = "✅ Analysis Done";
            } catch (err) { 
                document.getElementById('status').innerText = "❌ Analysis Error"; 
            }
        }

        window.renderReview = () => {
            const container = document.getElementById('itemContainer'); container.innerHTML = "";
            const defTax = document.getElementById('defaultTax').value;
            const defRebate = document.getElementById('globalRebate').value;

            localItems.forEach((item, i) => {
                const div = document.createElement('div'); div.className = "item-row";
                div.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="checkbox" checked id="sync-${i}" style="width:20px; height:20px; margin:0;">
                        <input type="text" value="${item.desc}" id="desc-${i}" style="font-weight:bold; margin:0;">
                    </div>
                    <div class="grid-2" style="margin-top:8px;">
                        <div><label>Item # / SKU</label><input type="text" value="${item.itemNo || ''}" id="no-${i}"></div>
                        <div><label>Category</label><input type="text" value="${item.cat || ''}" id="cat-${i}"></div>
                    </div>
                    <div class="grid-3" style="margin-top:8px;">
                        <div><label>Qty</label><input type="number" value="${item.qty || 1}" id="qty-${i}" oninput="recalc(${i})"></div>
                        <div><label>Unit $</label><input type="number" step="0.01" value="${item.unit || item.total}" id="unit-${i}" oninput="recalc(${i})"></div>
                        <div><label>Base Total</label><input type="number" step="0.01" value="${item.total}" id="base-${i}" oninput="recalc(${i})"></div>
                    </div>
                    <div class="calc-box grid-2">
                        <div><label>Tax %</label><input type="number" value="${item.isTaxable ? defTax : 0}" id="taxR-${i}" oninput="recalc(${i})"></div>
                        <div><label>Rebate (% or $)</label><input type="text" value="${defRebate}%" id="rebR-${i}" oninput="recalc(${i})"></div>
                    </div>
                    <div id="results-${i}" class="final-badge">Calculating...</div>
                `;
                container.appendChild(div); recalc(i);
            });
            document.getElementById('reviewSection').style.display = "block";
        }

        window.recalc = (i) => {
            const baseInput = document.getElementById(`base-${i}`);
            const qty = parseFloat(document.getElementById(`qty-${i}`).value) || 1;
            const unit = parseFloat(document.getElementById(`unit-${i}`).value) || 0;
            
            if (document.activeElement !== baseInput) { baseInput.value = (qty * unit).toFixed(2); }
            
            const base = parseFloat(baseInput.value) || 0;
            const taxR = parseFloat(document.getElementById(`taxR-${i}`).value) || 0;
            const rebRaw = document.getElementById(`rebR-${i}`).value;
            
            // MATH ROUNDING TO PENNY
            const taxAmt = Math.round(base * (taxR / 100) * 100) / 100;
            const pricePlusTax = Math.round((base + taxAmt) * 100) / 100;
            
            const rebAmt = rebRaw.includes('%') 
                ? Math.round(base * (parseFloat(rebRaw) / 100) * 100) / 100 
                : Math.round((parseFloat(rebRaw) || 0) * 100) / 100;
            
            // Formula: (Price + Tax) - Rebate
            const finalCost = Math.round((pricePlusTax - rebAmt) * 100) / 100;

            document.getElementById(`results-${i}`).innerHTML = `
                <b>Final Cost: $${finalCost.toFixed(2)}</b><br>
                <small>Math: ($${pricePlusTax.toFixed(2)} with tax) - $${rebAmt.toFixed(2)} rebate</small>
            `;
            localItems[i].calculated = { pricePlusTax, rebAmt, finalCost };
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const sheetUrl = localStorage.getItem('sheet_url');
            const dataToSend = localItems.filter((_, i) => document.getElementById(`sync-${i}`).checked).map((item, i) => ({
                date: document.getElementById('globalDate').value,
                store: document.getElementById('globalStore').value,
                payment: document.getElementById('paymentMethod').value,
                rebateID: document.getElementById('rebateNum').value,
                itemNo: document.getElementById(`no-${i}`).value,
                description: document.getElementById(`desc-${i}`).value,
                category: document.getElementById(`cat-${i}`).value,
                qty: document.getElementById(`qty-${i}`).value,
                unitPrice: document.getElementById(`unit-${i}`).value,
                baseTotal: document.getElementById(`base-${i}`).value,
                taxRate: document.getElementById(`taxR-${i}`).value,
                pricePlusTax: item.calculated.pricePlusTax.toFixed(2),
                rebateApplied: item.calculated.rebAmt.toFixed(2),
                finalCost: item.calculated.finalCost.toFixed(2)
            }));
            
            document.getElementById('status').innerText = "📤 Syncing...";
            try {
                await fetch(sheetUrl, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({items: dataToSend, imageFile: base64Image, saveImage: document.getElementById('saveImage').checked}) 
                });
                document.getElementById('status').innerText = "🚀 Success!";
                setTimeout(clearAllFields, 2000);
            } catch (e) { document.getElementById('status').innerText = "❌ Sync Error"; }
        });

        window.clearAllFields = () => {
            // Reset Global Meta
            document.getElementById('globalStore').value = "";
            document.getElementById('globalDate').value = "";
            document.getElementById('paymentMethod').value = "";
            document.getElementById('rebateNum').value = "";
            // Keep default rates as they are usually constant
            
            // Reset UI
            document.getElementById('reviewSection').style.display = "none";
            document.getElementById('previewContainer').style.display = "none";
            document.getElementById('cameraInput').value = "";
            document.getElementById('status').innerText = "Ready";
            localItems = [];
            base64Image = "";
        };

        window.saveSettings = () => {
            localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
            localStorage.setItem('sheet_url', document.getElementById('sheetUrl').value);
            document.getElementById('configPanel').style.display='none';
        };
    </script>
</body>
</html>
