<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ledger Pro 4.4 - Hybrid Engine</title>
    <script type="importmap"> { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai@latest" } } </script>
    <style>
        :root { --menards: #15803d; --lowes: #004990; --danger: #dc2626; --slate: #1e293b; --amber: #fff7ed; }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 12px; background: #f8fafc; color: var(--slate); margin: auto; max-width: 500px; }
        .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 12px; border: 1px solid #e2e8f0; }
        .summary-card { background: var(--slate); color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .summary-val { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }
        .store-tag { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: white; background: #94a3b8; }
        .menards-ui { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 8px; margin-top: 8px; }
        .lowes-ui { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px; border-radius: 8px; margin-top: 8px; }
        .return-ui { border: 2px solid var(--danger) !important; background: #fef2f2 !important; }
        label { display: block; font-size: 10px; font-weight: bold; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .item-row { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; position: relative; }
        .final-badge { background: #f1f5f9; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; border-left: 4px solid #6366f1; }
        .btn-sync { background: #10b981; color: white; width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .camera-label { background: #6366f1; color: white; padding: 20px; display: block; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #configPanel { display:none; background: var(--amber); border: 2px dashed #fbbf24; }
    </style>
</head>
<body>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="margin:0;">Ledger Pro <span style="font-size:0.8rem; opacity:0.6;">v4.4</span></h2>
        <button onclick="document.getElementById('configPanel').style.display='block'" style="background:none; border:none; font-size:1.5rem;">⚙️</button>
    </div>

    <div class="card summary-card">
        <div><label style="color:#94a3b8">PENDING REBATES</label><div id="dashPending" class="summary-val">$0.00</div></div>
        <div><label style="color:#94a3b8">EST. NET OUTLAY</label><div id="dashNet" class="summary-val">$0.00</div></div>
    </div>

    <div id="configPanel" class="card">
        <label>Gemini API Key</label><input type="password" id="apiKey">
        <label>Google Script URL</label><input type="text" id="sheetUrl">
        <button onclick="saveSettings()" style="width:100%; padding:10px; margin-top:10px; border-radius:8px; background:var(--slate); color:white;">Save Settings</button>
    </div>

    <div class="card" id="headerCard">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span id="storeTag" class="store-tag">General</span>
            <span id="returnTag" class="store-tag" style="background:var(--danger); display:none;">Return Receipt</span>
        </div>
        
        <div class="grid-2">
            <div><label>Store</label><input type="text" id="globalStore" oninput="updateTheme()"></div>
            <div><label>Date</label><input type="date" id="globalDate"></div>
        </div>
        
        <div class="grid-2" style="margin-top:5px;">
            <div><label>Orig. Date (Returns)</label><input type="date" id="origDate"></div>
            <div><label>Payment</label><input type="text" id="payMethod" placeholder="Lowe's Card / Visa"></div>
        </div>

        <div id="mLogic" class="menards-ui" style="display:none;">
            <label style="display:flex; align-items:center; gap:8px; color:var(--menards); font-size:12px;">
                <input type="checkbox" id="m11" checked onchange="renderReview()"> Apply 11% Rebate Calculation?
            </label>
        </div>
        <div id="lLogic" class="lowes-ui" style="display:none;">
            <label style="display:flex; align-items:center; gap:8px; color:var(--lowes); font-size:12px;">
                <input type="checkbox" id="l5" checked onchange="renderReview()"> Apply 5% CC Discount Logic?
            </label>
        </div>
    </div>

    <div class="card">
        <label for="cam" class="camera-label">📸 SCAN NEW RECEIPT</label>
        <input type="file" id="cam" accept="image/*" capture="environment" style="display:none;">
        <div id="status" style="text-align:center; font-size:12px; margin-top:10px; font-weight:bold;">Ready</div>
    </div>

    <div id="reviewSection" style="display:none;">
        <div id="itemContainer"></div>
        <button id="syncBtn" class="btn-sync">🚀 SYNC 17 COLUMNS</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        let items = [];
        let rawImage = "";

        // UI HELPERS
        window.saveSettings = () => {
            localStorage.setItem('key', document.getElementById('apiKey').value);
            localStorage.setItem('url', document.getElementById('sheetUrl').value);
            document.getElementById('configPanel').style.display = 'none';
        };

        window.updateTheme = () => {
            const store = document.getElementById('globalStore').value.toLowerCase();
            const tag = document.getElementById('storeTag');
            document.getElementById('mLogic').style.display = store.includes('menards') ? 'block' : 'none';
            document.getElementById('lLogic').style.display = store.includes('lowe') ? 'block' : 'none';
            tag.innerText = store.includes('menards') ? 'Menards' : (store.includes('lowe') ? "Lowe's" : "General");
            tag.style.background = store.includes('menards') ? 'var(--menards)' : (store.includes('lowe') ? 'var(--lowes)' : '#94a3b8');
        };

        // CALCULATION LOGIC
        window.recalc = (i) => {
            const store = document.getElementById('globalStore').value.toLowerCase();
            const qty = parseFloat(document.getElementById(`q-${i}`).value) || 0;
            const unit = parseFloat(document.getElementById(`u-${i}`).value) || 0;
            const taxRate = (parseFloat(document.getElementById(`tr-${i}`).value) || 0) / 100;
            
            let baseT, taxA, pPlusTax, rebA, finalC, pMinReb;

            if (store.includes('lowe')) {
                const disc = document.getElementById('l5').checked ? 0.95 : 1;
                baseT = qty * (unit * disc);
                taxA = baseT * taxRate;
                pPlusTax = baseT + taxA;
                rebA = 0;
                pMinReb = baseT;
                finalC = pPlusTax;
            } else if (store.includes('menards')) {
                const is11 = document.getElementById('m11').checked;
                const manualReb = parseFloat(document.getElementById(`mo-${i}`).value) || 0;
                baseT = qty * unit;
                taxA = baseT * taxRate;
                pPlusTax = baseT + taxA;
                rebA = is11 ? (baseT * 0.11) : manualReb;
                pMinReb = baseT - rebA;
                finalC = pPlusTax - rebA;
            } else {
                baseT = qty * unit;
                taxA = baseT * taxRate;
                pPlusTax = baseT + taxA;
                rebA = 0; pMinReb = baseT; finalC = pPlusTax;
            }

            document.getElementById(`res-${i}`).innerHTML = `
                <div class="grid-2">
                    <span>Tax: $${taxA.toFixed(2)}</span>
                    <span>Final: <b>$${finalC.toFixed(2)}</b></span>
                </div>
            `;
            items[i].calc = { baseT, pPlusTax, pMinReb, finalC, rebA };
        };

        // AI ENGINE
        document.getElementById('cam').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if(!file) return;
            document.getElementById('status').innerText = "Analyzing Receipt...";
            const reader = new FileReader();
            reader.onloadend = async () => {
                rawImage = reader.result.split(',')[1];
                const genAI = new GoogleGenerativeAI(localStorage.getItem('key'));
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash", generationConfig: {responseMimeType: "application/json"} });
                
                const prompt = `Return JSON only: {"store":"str","date":"YYYY-MM-DD","origDate":"YYYY-MM-DD","isReturn":bool,"items":[{"itemNo":"str","description":"str","qty":num,"unitPrice":num,"isTaxable":bool}]}. 
                Note: If it's a return, make Qty/Price negative and find the original purchase date.`;

                try {
                    const result = await model.generateContent([prompt, {inlineData: {data: rawImage, mimeType: "image/jpeg"}}]);
                    const data = JSON.parse(result.response.text());
                    document.getElementById('globalStore').value = data.store || "";
                    document.getElementById('globalDate').value = data.date || "";
                    document.getElementById('origDate').value = data.origDate || data.date;
                    document.getElementById('returnTag').style.display = data.isReturn ? 'block' : 'none';
                    if(data.isReturn) document.getElementById('headerCard').classList.add('return-ui');
                    updateTheme();
                    items = data.items;
                    renderReview();
                    document.getElementById('status').innerText = "Review Required";
                } catch (err) { document.getElementById('status').innerText = "AI Error. Check Key."; }
            };
            reader.readAsDataURL(file);
        });

        window.renderReview = () => {
            const container = document.getElementById('itemContainer'); container.innerHTML = "";
            items.forEach((item, i) => {
                const div = document.createElement('div'); div.className = "item-row";
                div.innerHTML = `
                    <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">${item.description}</div>
                    <div class="grid-2">
                        <div><label>SKU</label><input type="text" value="${item.itemNo||''}" id="sku-${i}"></div>
                        <div><label>Category</label><select id="cat-${i}"><option>Lumber</option><option>Hardware</option><option>Tools</option><option>Electrical</option><option>Plumbing</option></select></div>
                    </div>
                    <div class="grid-3">
                        <div><label>Qty</label><input type="number" step="any" value="${item.qty}" id="q-${i}" oninput="recalc(${i})"></div>
                        <div><label>Unit $</label><input type="number" step="0.01" value="${item.unitPrice}" id="u-${i}" oninput="recalc(${i})"></div>
                        <div><label>Tax %</label><input type="number" value="${item.isTaxable?7:0}" id="tr-${i}" oninput="recalc(${i})"></div>
                    </div>
                    <div id="mExt-${i}" style="display:${document.getElementById('globalStore').value.toLowerCase().includes('menards')?'block':'none'}">
                        <label>Custom Rebate $</label><input type="number" step="0.01" id="mo-${i}" oninput="recalc(${i})">
                    </div>
                    <div id="res-${i}" class="final-badge"></div>
                `;
                container.appendChild(div); recalc(i);
            });
            document.getElementById('reviewSection').style.display = "block";
        };

        // SYNC ENGINE
        document.getElementById('syncBtn').onclick = async () => {
            document.getElementById('status').innerText = "Uploading to Sheet & Drive...";
            const payload = {
                imageBlob: rawImage,
                items: items.map((item, i) => ({
                    date: document.getElementById('globalDate').value,
                    origDate: document.getElementById('origDate').value,
                    itemNo: document.getElementById(`sku-${i}`).value,
                    description: item.description,
                    qty: document.getElementById(`q-${i}`).value,
                    unitPrice: document.getElementById(`u-${i}`).value,
                    baseTotal: item.calc.baseT.toFixed(2),
                    pricePlusTax: item.calc.pPlusTax.toFixed(2),
                    priceMinusRebate: item.calc.pMinReb.toFixed(2),
                    finalCost: item.calc.finalC.toFixed(2),
                    payment: document.getElementById('payMethod').value,
                    category: document.getElementById(`cat-${i}`).value,
                    rebateID: "", // Manual entry if needed
                    rebateDesc: document.getElementById('globalStore').value.includes('Menards') ? "11% Rebate" : "",
                    rebateApplied: item.calc.rebA.toFixed(2)
                }))
            };

            try {
                await fetch(localStorage.getItem('url'), { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Success! Check your Sheet.");
                location.reload();
            } catch (e) { alert("Sync Failed. Check Script URL."); }
        };
    </script>
</body>
</html>
