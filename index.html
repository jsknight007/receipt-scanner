<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger Pro v8.0</title>
<style>
/* same styling as v7 for brevity */
</style>
</head>
<body>

<h2>Ledger Pro v8.0</h2>

<input type="text" id="url" placeholder="Apps Script URL">
<input type="file" id="fileIn" accept="image/*">
<div id="status">Ready</div>

<div id="items"></div>
<button onclick="sync()">Sync</button>

<script>
const TAX_RATE = 0.06;
let capturedItems = [];
let base64Img = "";
let mimeType = "image/jpeg";

function round(n){ return Math.round(n*100)/100; }

function computeItem({q,p,itemManual,isT,m11,gD}){
  const base=q*p;
  let tax=0,minusRebate=0,final=0,rebAmt=0;

  if(m11){
    tax=isT?round(base*TAX_RATE):0;
    rebAmt=round((base*0.11)+itemManual);
    minusRebate=round(base-rebAmt);
    final=round(base+tax-rebAmt);
  } else {
    rebAmt=round((base*gD)+itemManual);
    minusRebate=round(base-rebAmt);
    tax=isT?round(minusRebate*TAX_RATE):0;
    final=round(minusRebate+tax);
  }

  return {base,tax,minusRebate,final,rebAmt};
}

document.getElementById("fileIn").onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  mimeType = file.type;

  const reader = new FileReader();
  reader.onloadend = async ()=>{
    base64Img = reader.result.split(',')[1];

    document.getElementById("status").innerText="Parsing…";

    const res = await fetch(getUrl(),{
      method:"POST",
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        mode:"PARSE_RECEIPT",
        imageBlob:base64Img,
        mimeType
      })
    });

    const json = await res.json();

    if(!json.ok){
      document.getElementById("status").innerText=json.error;
      return;
    }

    capturedItems = json.data.items || [];
    renderItems();
    document.getElementById("status").innerText="Ready";
  };

  reader.readAsDataURL(file);
};

function renderItems(){
  const container = document.getElementById("items");
  container.innerHTML="";

  capturedItems.forEach((it,i)=>{
    container.innerHTML += `
      <div>
        ${it.description}
        <input type="number" id="q-${i}" value="${it.qty}">
        <input type="number" id="p-${i}" value="${it.unitPrice}">
      </div>
    `;
  });
}

async function sync(){
  const payload = {
    mode:"SYNC_ITEMS",
    imageBlob:base64Img,
    mimeType,
    items: capturedItems.map((it,i)=>{
      const q=parseFloat(document.getElementById(`q-${i}`).value)||0;
      const p=parseFloat(document.getElementById(`p-${i}`).value)||0;

      const {base,tax,minusRebate,final,rebAmt} =
        computeItem({q,p,itemManual:0,isT:true,m11:false,gD:0});

      return {
        date:new Date().toISOString().slice(0,10),
        origDate:"",
        itemNo:it.itemNo,
        description:it.description,
        qty:q,
        unitPrice:p,
        baseTotal:base,
        taxedAmt:tax,
        minusRebate:minusRebate,
        finalCost:final,
        payment:"",
        category:"Materials",
        rebateId:"",
        rebateDesc:"",
        rebateAmt:rebAmt,
        store:it.store
      };
    })
  };

  if(!navigator.onLine){
    queueOffline(payload);
    alert("Saved offline");
    return;
  }

  await sendPayload(payload);
}

async function sendPayload(payload){
  const res = await fetch(getUrl(),{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });

  const json = await res.json();
  if(!json.ok) alert(json.error);
  else alert("Synced");
}

function queueOffline(payload){
  const q = JSON.parse(localStorage.getItem("ledgerQueue")||"[]");
  q.push(payload);
  localStorage.setItem("ledgerQueue",JSON.stringify(q));
}

window.addEventListener("online", flushQueue);

async function flushQueue(){
  const q = JSON.parse(localStorage.getItem("ledgerQueue")||"[]");
  if(!q.length) return;

  for(const payload of q){
    await sendPayload(payload);
  }

  localStorage.removeItem("ledgerQueue");
}

function getUrl(){
  return document.getElementById("url").value;
}
</script>

</body>
</html>
