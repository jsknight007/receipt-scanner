<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ledger Pro 4.5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366f1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #111827;
    }

    header {
      background: #6366f1;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: auto;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .install-btn {
      display: none;
      margin-top: 10px;
      background: #10b981;
    }

    footer {
      text-align: center;
      font-size: 12px;
      margin-top: 20px;
      color: #6b7280;
    }
  </style>
</head>
<body>

<header>Ledger Pro 4.5</header>

<main>
  <label>Date</label>
  <input type="date" id="date" />

  <label>Store</label>
  <input type="text" id="store" placeholder="Lowes, Menards, etc." />

  <label>Item #</label>
  <input type="text" id="itemNo" />

  <label>Description</label>
  <input type="text" id="description" />

  <label>Qty</label>
  <input type="number" id="qty" step="1" />

  <label>Unit Price</label>
  <input type="number" id="unitPrice" step="0.01" />

  <label>Base Total</label>
  <input type="number" id="baseTotal" step="0.01" />

  <label>Minus Rebate</label>
  <input type="number" id="minusRebate" step="0.01" />

  <label>Taxed Amount</label>
  <input type="number" id="taxedAmt" step="0.01" />

  <label>Final Cost</label>
  <input type="number" id="finalCost" step="0.01" />

  <label>Payment</label>
  <input type="text" id="payment" />

  <label>Category</label>
  <input type="text" id="category" />

  <button id="submitBtn">Submit Entry</button>
  <button id="installBtn" class="install-btn">Install App</button>

  <div class="status" id="status"></div>

  <footer>Ledger Pro • Offline Ready</footer>
</main>

<script>
  const WEB_APP_URL = "YOUR_WEB_APP_URL";

  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  function setStatus(msg, color = "#111827") {
    statusEl.textContent = msg;
    statusEl.style.color = color;
  }

  submitBtn.addEventListener("click", async () => {
    submitBtn.disabled = true;
    setStatus("Submitting...");

    const payload = {
      items: [
        {
          date: document.getElementById("date").value,
          origDate: document.getElementById("date").value,
          itemNo: document.getElementById("itemNo").value,
          description: document.getElementById("description").value,
          qty: document.getElementById("qty").value,
          unitPrice: document.getElementById("unitPrice").value,
          baseTotal: document.getElementById("baseTotal").value,
          minusRebate: document.getElementById("minusRebate").value,
          taxedAmt: document.getElementById("taxedAmt").value,
          finalCost: document.getElementById("finalCost").value,
          payment: document.getElementById("payment").value,
          category: document.getElementById("category").value,
          rebateId: "",
          rebateDesc: "",
          rebateAmt: "",
          store: document.getElementById("store").value
        }
      ]
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" }
      });

      if (res.ok) {
        setStatus("Saved ✅", "#10b981");
        document.querySelectorAll("input").forEach(i => i.value = "");
      } else {
        throw new Error("Server error");
      }
    } catch (err) {
      setStatus("Failed ❌ (offline or server)", "#ef4444");
    }

    submitBtn.disabled = false;
  });

  /* =========================
     SERVICE WORKER REGISTER
  ========================== */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.update();
      console.log("SW registered");
    }).catch(err => console.log("SW failed", err));
  }

  /* =========================
     INSTALL PROMPT HANDLER
  ========================== */
  let deferredPrompt;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === "accepted") {
      installBtn.style.display = "none";
    }
    deferredPrompt = null;
  });
</script>

</body>
</html>
