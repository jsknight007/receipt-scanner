<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";
    let items = []; let rawImage = "";

    // Fix 1: Store logic trigger
    window.updateTheme = () => {
        const store = (document.getElementById('globalStore').value || "").toLowerCase();
        const tag = document.getElementById('storeTag');
        const header = document.getElementById('headerCard');
        
        // Menards Check
        const isMenards = store.includes('menards');
        const isLowes = store.includes('lowe');

        tag.innerText = isMenards ? 'Menards' : (isLowes ? "Lowe's" : "General");
        tag.style.background = isMenards ? 'var(--menards)' : (isLowes ? 'var(--lowes)' : '#94a3b8');
        
        // UI Logic visibility
        const mLogic = document.getElementById('mLogic');
        if (mLogic) mLogic.style.display = isMenards ? 'block' : 'none';
    };

    document.getElementById('cam').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onloadend = async () => {
            rawImage = reader.result.split(',')[1];
            const key = localStorage.getItem('key');
            
            document.getElementById('status').innerText = "🧠 AI ANALYZING...";
            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

                const prompt = `Return JSON only: {"store":"str","date":"YYYY-MM-DD","origDate":"YYYY-MM-DD","isReturn":bool,"items":[{"itemNo":"str","description":"str","qty":num,"unitPrice":num,"isTaxable":bool}]}`;
                const result = await model.generateContent([prompt, {inlineData: {data: rawImage, mimeType: "image/jpeg"}}]);
                const data = JSON.parse(result.response.text());

                document.getElementById('globalStore').value = data.store || "";
                document.getElementById('globalDate').value = data.date || "";
                document.getElementById('origDate').value = data.origDate || data.date;
                
                // Fix 2: Force theme and toggle update
                updateTheme();
                items = data.items;
                renderReview(); 
                document.getElementById('status').innerText = "✅ REVIEW & SYNC";
            } catch (err) {
                document.getElementById('status').innerText = "❌ AI ERROR";
                console.error(err);
            }
        };
        reader.readAsDataURL(file);
    });

    // Fix 3: Sync Logic
    document.getElementById('syncBtn').onclick = async () => {
        const url = localStorage.getItem('url');
        if(!url) { alert("Missing Apps Script URL!"); return; }

        document.getElementById('status').innerText = "☁️ SYNCING...";
        const isMenards = document.getElementById('globalStore').value.toLowerCase().includes('menards');
        const apply11 = isMenards && document.getElementById('m11') ? document.getElementById('m11').checked : false;

        const payload = {
            imageBlob: rawImage,
            items: items.map((item, i) => {
                const qty = document.getElementById(`qty-${i}`).value;
                const price = document.getElementById(`prc-${i}`).value;
                const base = (qty * price).toFixed(2);
                return {
                    date: document.getElementById('globalDate').value,
                    origDate: document.getElementById('origDate').value,
                    itemNo: item.itemNo || "",
                    description: document.getElementById(`desc-${i}`).value,
                    qty: qty,
                    unitPrice: price,
                    baseTotal: base,
                    pricePlusTax: (base * 1.07).toFixed(2), // Example 7% tax
                    rebateApplied: apply11 ? (base * 0.11).toFixed(2) : "0.00",
                    store: document.getElementById('globalStore').value
                };
            })
        };

        try {
            // Updated fetch parameters for better Google compatibility
            const response = await fetch(url, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            alert("Sent! Check Sheet.");
            location.reload();
        } catch (e) {
            alert("Network Error: " + e.message);
        }
    };
</script>
